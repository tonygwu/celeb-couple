<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Libre+Franklin:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#fafaf8;color:#171a21;
 font-family:"Libre Franklin",system-ui,sans-serif;display:flex;flex-direction:column;
 justify-content:center;padding:74px 80px;overflow:hidden}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:19px;letter-spacing:.16em;
 text-transform:uppercase;color:#6d717a;margin-bottom:26px;white-space:nowrap}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:88px;
 line-height:1.0;margin-bottom:30px;max-width:19ch}
p{font-size:27px;line-height:1.45;color:#3d424b;max-width:40ch}
.row{display:flex;gap:16px;margin-top:40px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:16px;letter-spacing:.06em;
 text-transform:uppercase;color:#6d717a;border:1px solid #dcdad4;padding:9px 16px}
.rule{position:absolute;left:0;top:0;width:14px;height:630px;background:#1c6b52}
</style></head><body>
<div class="rule"></div>
<p class="eyebrow">Model judgments &middot; not measurements</p>
<h1>Celebrities Punching Above Their Weight</h1>
<p>Which actors and actresses end up with partners judged more attractive than
themselves, on screen and in real life?</p>
<div class="row">
  <span class="chip">Men</span><span class="chip">Women</span>
  <span class="chip">On screen</span><span class="chip">Real life</span>
</div>
</body></html>
