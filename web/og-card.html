<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Libre+Franklin:wght@400;500&display=swap">
<style>
/* Sized so it survives BOTH renderings. LinkedIn and Slack often show a ~255px
   compact thumbnail, which is 21% scale: anything under about 42px here turns
   to mush there. The old card had a 19px eyebrow, 27px body and 16px chips,
   which came out at 4.0, 5.7 and 3.4px. Only the headline was readable.
   Everything below is >= 46px. */
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#fafaf8;color:#171a21;
 font-family:"Libre Franklin",system-ui,sans-serif;display:flex;flex-direction:column;
 justify-content:center;padding:0 86px;overflow:hidden;position:relative}
.rule{position:absolute;left:0;top:0;width:18px;height:630px;background:#1c6b52}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:112px;
 line-height:0.97;letter-spacing:-.005em;max-width:15ch}
p{font-size:46px;line-height:1.3;color:#3d424b;margin-top:34px;max-width:38ch;text-wrap:balance}
p b{color:#1c6b52;font-weight:500}
</style></head><body>
<div class="rule"></div>
<h1>Celebrities Punching Above Their Weight</h1>
<p>Who dated <b>up</b>, and who dated <b>down</b>?</p>
</body></html>
