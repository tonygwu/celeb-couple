name: tests

# The suite is offline and deterministic and runs in well under a second, so
# there is no reason it should not gate. It spends no model quota: every judge
# is faked, and the live paths are opt-in behind environment variables.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        # Treat ANY non-zero exit as failure, exit code 5 (no tests collected)
        # included. A wrapper that only checks for 1 would pass an empty suite.
        run: |
          set -o pipefail
          python -m pytest tests -q
