[project]
name = "celeb-couple"
version = "0.0.1"
description = "Celebrity Pairing WAR - bounded M0 pilot"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# No -q here: the documented entrypoint already passes -q, and -qq
# suppresses the "N passed" line that AGENTS.md tells agents to read.

[tool.setuptools.packages.find]
include = ["packages*"]
